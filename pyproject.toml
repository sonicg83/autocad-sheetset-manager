[project]
name = "autocad-sheetset"
version = "0.3.5"
description = "本地 DST 图纸集管理器"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "lxml>=6,<7",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.32",
    "pywebview>=5,<6",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0,<3",
    "tavily-cli>=0.1.8",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
dst-manager = "dst_manager.interfaces.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyinstaller>=6,<7",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dst_manager", "src/dst_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto：默认按 CPU 核数并行（pytest-xdist）。套件约定不依赖执行顺序与共享
# 本地状态（见 AGENTS.md「测试要求」），个别需要独占资源的用例可用
# xdist_group 标记或 -p no:xdist 临时退回串行。
addopts = "-q -n auto"
