<style>

*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--strong);border-radius:7px;background:var(--surface);padding:7px 12px;min-height:34px;cursor:pointer;white-space:nowrap}button:hover:not(:disabled){background:var(--muted)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:hover:not(:disabled){background:var(--blue-hover)}html.dark .primary{color:#10151e}.quiet{border-color:transparent;background:transparent;color:var(--secondary)}.danger-link{border-color:transparent;background:transparent;color:var(--red);padding-inline:7px}.link{border-color:transparent;background:transparent;color:var(--blue);padding:4px 6px;min-height:28px}.small-button{font-size:12px;padding:4px 8px;min-height:28px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}input,select,textarea{border:1px solid var(--strong);border-radius:7px;background:var(--surface);padding:8px 10px;min-width:0;max-width:100%}textarea{resize:vertical;line-height:1.55;min-height:58px}h1,h2,h3,p{margin:0}h1{font-size:16px}h2{font-size:18px}h3{font-size:13px}.spacer{flex:1}.row{display:flex;align-items:center;gap:9px}.wrap{flex-wrap:wrap}.muted-text{color:var(--secondary)}.small{font-size:12px}.mono{font-family:ui-monospace,Consolas,monospace}.badge{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}.good{color:var(--green);background:var(--greenbg)}.warn{color:var(--amber);background:var(--amberbg)}.bad{color:var(--red);background:var(--redbg)}.blue{color:var(--blue);background:var(--bluebg)}
#app{height:100%;display:flex;flex-direction:column}.top{height:56px;flex-shrink:0;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:13px}.identity{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px}.tabs{height:46px;display:flex;align-items:stretch;gap:2px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}.tab{border:0;border-radius:0;border-bottom:2px solid transparent;padding:0 16px;color:var(--secondary);background:transparent}.tab.active{border-bottom-color:var(--blue);color:var(--blue);font-weight:600}.page{padding:18px 22px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}.page-head{display:flex;align-items:flex-start;gap:16px}.page-head p{margin-top:5px}.template-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 15px;display:flex;align-items:end;gap:10px;flex-wrap:wrap;box-shadow:0 1px 2px #1826420a}.field-label{display:grid;gap:5px;color:var(--secondary);font-size:12px}.field-label select{min-width:240px}.template-meta{align-self:center;display:flex;align-items:center;gap:8px}.workspace-grid{display:grid;grid-template-columns:258px minmax(470px,1fr);gap:12px;min-height:425px}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-width:0}.card-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}.card-body{padding:13px 14px}.field-card{display:flex;flex-direction:column}.field-search{width:100%;margin-bottom:12px}.field-list{overflow:auto;padding:0 12px 12px;flex:1}.field-group{margin-top:12px}.field-group h3{color:var(--secondary);margin:0 0 6px;padding:0 3px}.field-chip{display:block;width:100%;text-align:left;border-color:transparent;background:transparent;padding:7px 8px;min-height:32px;white-space:normal}.field-chip:hover{background:var(--bluebg);color:var(--blue)}.field-chip code{font-family:ui-monospace,Consolas,monospace;font-size:12px}.field-chip small{display:block;color:var(--secondary);margin-top:2px}.editor-card{display:flex;flex-direction:column}.compat{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.65}.compat.ok{background:var(--greenbg);color:var(--green)}.compat.warning{background:var(--amberbg);color:var(--amber)}.compat.error{background:var(--redbg);color:var(--red)}.columns-head{display:grid;grid-template-columns:34px minmax(110px,.62fr) minmax(250px,1.8fr) 92px 188px;gap:8px;padding:9px 12px;background:var(--muted);color:var(--secondary);font-size:12px}.columns{overflow:auto;flex:1}.column-row{display:grid;grid-template-columns:34px minmax(110px,.62fr) minmax(250px,1.8fr) 92px 188px;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:start}.column-row.is-error{background:var(--redbg)}.drag-handle{color:var(--secondary);text-align:center;padding-top:10px;font-size:12px}.column-row input{width:100%}.expression-wrap{display:grid;gap:5px}.expression-error{font-size:12px;color:var(--red);line-height:1.5}.status-cell{padding-top:8px}.row-actions{display:flex;gap:4px;justify-content:flex-end;padding-top:1px}.editor-foot{padding:10px 12px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--border)}.preview-card{display:flex;flex-direction:column;min-height:250px}.preview-meta{margin-left:auto;display:flex;gap:8px;align-items:center}.table-wrap{overflow:auto;max-height:300px}.preview-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;table-layout:auto}.preview-table th{position:sticky;top:0;background:var(--muted);color:var(--secondary);font-size:12px;font-weight:600;z-index:1}.preview-table td,.preview-table th{padding:10px 13px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.preview-table td{background:var(--surface)}.preview-table tr:hover td{background:var(--canvas)}.empty{padding:38px 18px;text-align:center;color:var(--secondary)}.empty strong{display:block;color:var(--text);margin-bottom:7px}.action-dock{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface)}.action-dock .summary{font-size:12px;color:var(--secondary)}
dialog{padding:0;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);width:480px;max-width:calc(100vw - 32px)}dialog::backdrop{background:#111c3266}.dialog-body{padding:22px}.dialog-body h2{margin-bottom:10px}.dialog-body p{color:var(--secondary);line-height:1.7;margin:7px 0}.dialog-body label{display:grid;gap:6px;margin-top:14px;color:var(--secondary);font-size:12px}.dialog-body input{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:20px}.path-choice{padding:10px 11px;border:1px solid var(--border);border-radius:8px;margin-top:8px;cursor:pointer;overflow-wrap:anywhere;font-size:13px}.path-choice:hover{background:var(--muted)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:11px 18px;border-radius:8px;box-shadow:var(--shadow);z-index:20;max-width:80vw}#toast:empty{display:none}[hidden]{display:none!important}
.column-row{border-left:3px solid transparent}.column-row.is-active{border-left-color:var(--blue);background:var(--bluebg)}
@media(max-width:980px){.top{padding:0 14px}.top .desktop-only{display:none}.tabs{padding:0 10px}.page{padding:14px}.workspace-grid{grid-template-columns:1fr}.field-card{max-height:235px}.editor-card{min-height:425px}.columns-head,.column-row{grid-template-columns:28px minmax(100px,.55fr) minmax(220px,1.4fr) 82px 164px}}
@media(max-width:720px){body{overflow:auto;height:auto;min-height:100vh}#app{min-height:100vh}.top{flex-wrap:wrap;height:auto;padding-block:9px}.identity{max-width:220px}.page{overflow:visible}.page-head{display:block}.template-bar{align-items:stretch}.field-label,.field-label select{width:100%}.workspace-grid{min-height:0}.columns-head{display:none}.column-row{grid-template-columns:28px 1fr;gap:7px}.column-row>*:not(.drag-handle){grid-column:2}.row-actions{justify-content:flex-start}.preview-meta{margin-left:0}.card-head{flex-wrap:wrap}.action-dock{flex-wrap:wrap}}

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-body" id="dialog-body"></div></dialog>
<script>
// 本文件仅用于 G4 交互验收：全部数据均为去敏虚构数据，不调用 API，也不读写任何文件。
const Demo=(()=>{
  const sheets=[
    {number:'001',title:'图纸目录',file_name:'RQ-001 图纸目录.dwg',props:{专业代码:'RQ',设计人:'张工'}},
    {number:'002',title:'道路平面图',file_name:'RQ-002 道路平面图.dwg',props:{专业代码:'RQ',设计人:'张工'}},
    {number:'003',title:'纵断面图',file_name:'RQ-003 纵断面图.dwg',props:{专业代码:'RQ',设计人:''}},
    {number:'004',title:'管线综合图',file_name:'RQ-004 管线综合图.dwg',props:{专业代码:'RQ',设计人:''}},
    {number:'005',title:'节点详图',file_name:'RQ-005 节点详图.dwg',props:{专业代码:'RQ',设计人:'李工'}}
  ];
  const fields=[
    {scope:'builtin',key:'sheet.number',group:'图纸固有字段',token:'{sheet.number}',label:'图号'},
    {scope:'builtin',key:'sheet.title',group:'图纸固有字段',token:'{sheet.title}',label:'图名'},
    {scope:'builtin',key:'sheet.file_name',group:'图纸固有字段',token:'{sheet.file_name}',label:'文件名'},
    {scope:'sheetset',key:'sheetset.项目名称',group:'图纸集自定义属性',token:'{sheetset.项目名称}',label:'项目名称'},
    {scope:'sheetset',key:'sheetset.项目编号',group:'图纸集自定义属性',token:'{sheetset.项目编号}',label:'项目编号'},
    {scope:'sheetset',key:'sheetset.项目.编号',group:'图纸集自定义属性',token:'{sheetset["项目.编号"]}',label:'项目.编号（特殊名称）'},
    {scope:'sheet',key:'sheet.专业代码',group:'图纸自定义属性',token:'{sheet.专业代码}',label:'专业代码'},
    {scope:'sheet',key:'sheet.设计人',group:'图纸自定义属性',token:'{sheet.设计人}',label:'设计人'}
  ];
  const templates={
    default:{id:'default',name:'默认图纸目录（内置）',builtin:true,columns:[['图号','{sheet.number}'],['图名','{sheet.title}'],['文件名','{sheet.file_name}']]},
    municipal:{id:'municipal',name:'市政标准目录',columns:[['图纸编号','{sheet.专业代码}-{sheet.number}'],['图名','{sheet.title}'],['项目名称','{sheetset.项目名称}'],['设计人','{sheet.设计人}']]},
    architecture:{id:'architecture',name:'建筑专业目录（不兼容）',columns:[['建筑图号','{sheet.建筑专业}-{sheet.number}'],['图名','{sheet.title}']]}
  };
  const sheetset={项目名称:'滨河市政工程',项目编号:'BH-2026','项目.编号':'BH.2026'};
  const clone=v=>structuredClone(v);
  function resolve(token,sheet){if(token==='sheet.number')return sheet.number;if(token==='sheet.title')return sheet.title;if(token==='sheet.file_name')return sheet.file_name;if(token.startsWith('sheetset.'))return sheetset[token.slice(9)]??'';if(token.startsWith('sheet.'))return sheet.props[token.slice(6)]??'';return '';}
  function evaluate(expression,sheet){return expression.replace(/\{\{/g,'\u0000').replace(/\}\}/g,'\u0001').replace(/\{(sheetset|sheet)\["([^"]+)"\]\}/g,(_,scope,name)=>resolve(`${scope}.${name}`,sheet)).replace(/\{(sheetset|sheet)\.([^{}\[\]]+)\}/g,(_,scope,name)=>resolve(`${scope}.${name}`,sheet)).replace(/\u0000/g,'{').replace(/\u0001/g,'}');}
  function validate(columns,available){const seen=new Set();return columns.map(c=>{const errors=[];const h=c.header.trim().toLocaleLowerCase();if(!h)errors.push('请输入列名');else if(seen.has(h))errors.push('列名不能重复');else seen.add(h);let balance=0;for(const x of c.expression){if(x==='{')balance++;if(x==='}')balance--;}if(!c.expression||balance!==0)errors.push('表达式花括号不完整');const refs=[...c.expression.matchAll(/\{(sheetset|sheet)\.([^{}\[\]]+)\}/g)].map(m=>`${m[1]}.${m[2]}`);for(const m of c.expression.matchAll(/\{(sheetset|sheet)\["([^"]+)"\]\}/g))refs.push(`${m[1]}.${m[2]}`);for(const ref of refs)if(!available.has(ref))errors.push(`当前图纸集未定义 ${ref}`);return errors;});}
  return {sheets,fields,templates,sheetset,clone,evaluate,validate};
})();
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let templates=Demo.clone(Demo.templates),selected='municipal',draft=toDraft(templates[selected]),saved=JSON.stringify(draft),scenario='normal',fieldQuery='',activeExpression=0,activeCaret=draft.columns[0].expression.length,previewState='ready',exporting=false,modalResolve=null,returnFocus=null;
function toDraft(t){return {name:t.name,builtin:!!t.builtin,columns:t.columns.map((c,i)=>({id:`c${i}-${Math.random().toString(16).slice(2)}`,header:c[0],expression:c[1]}))};}
function dirty(){return JSON.stringify(draft)!==saved}function available(){const set=new Set(Demo.fields.map(f=>f.key));if(scenario==='missing')set.delete('sheet.专业代码');return set;}
function issues(){return Demo.validate(draft.columns,available())}function blocking(){return issues().some(x=>x.length)}
function toast(message){$('toast').textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',4200)}
function ask(title,html,actions){returnFocus=document.activeElement;$('dialog-body').innerHTML=`<h2 id="dialog-title">${esc(title)}</h2>${html}<div class="dialog-actions">${actions.map(a=>`<button data-action="dialog-choice" data-value="${a.value}" class="${a.primary?'primary':''}">${esc(a.label)}</button>`).join('')}</div>`;$('dialog').showModal();return new Promise(r=>modalResolve=r)}
function finishAsk(value){$('dialog').close();modalResolve?.(value);modalResolve=null;if(returnFocus?.isConnected)returnFocus.focus()}
async function guard(next){if(!dirty()){next();return}const r=await ask('模板有未保存的修改','<p>切换模板前请选择如何处理当前修改。</p>',[{label:'留在此处',value:'cancel'},{label:'放弃修改',value:'discard'},{label:'另存为模板',value:'save',primary:true}]);if(r==='save'){if(await saveAs())next();else render();return}if(r==='discard')next();else render()}
function compatibility(errors){if(scenario==='loading')return {cls:'warning',label:'正在检查模板与当前图纸集…',detail:'请稍候，完成后才能预览或导出。'};if(errors.some(x=>x.length))return {cls:'error',label:'不能导出',detail:errors.flat()[0]};if(scenario==='empty')return {cls:'ok',label:'可以导出',detail:'当前图纸集没有图纸，将生成仅含表头的 XLSX。'};return {cls:'warning',label:'可以导出，有 1 项提示',detail:'2 张图纸的“设计人”没有值，将按空文本导出。'}}
function header(){return `<header class="top"><h1>DST Manager</h1><span class="badge good desktop-only">工作区已加载</span><span class="identity muted-text">滨河市政工程.dst</span><span class="spacer"></span><label class="small muted-text desktop-only" for="scenario">演示场景</label><select id="scenario" aria-label="演示场景"><option value="normal" ${scenario==='normal'?'selected':''}>正常与缺值警告</option><option value="missing" ${scenario==='missing'?'selected':''}>模板缺少属性</option><option value="empty" ${scenario==='empty'?'selected':''}>空图纸集</option><option value="loading" ${scenario==='loading'?'selected':''}>检查中</option></select><button class="quiet" data-action="theme">切换主题</button></header><nav class="tabs" role="tablist" aria-label="功能分区"><button class="tab">① 图纸</button><button class="tab">② 属性</button><button class="tab">③ 修订历史</button><button class="tab active" role="tab" aria-selected="true">图纸目录</button></nav>`}
function templateBar(){return `<section class="template-bar" aria-label="模板管理"><label class="field-label">当前模板<select id="template-select">${Object.values(templates).map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><div class="template-meta"><span class="badge ${draft.builtin?'blue':'good'}">${draft.builtin?'内置模板':'已保存模板'}</span><span class="small muted-text">${dirty()?'有未保存修改':'已保存'}</span></div><span class="spacer"></span><button data-action="save-as">另存为模板</button><button data-action="save" ${draft.builtin||!dirty()?'disabled':''}>保存修改</button><button class="danger-link" data-action="delete-template" ${draft.builtin?'disabled':''}>删除模板</button></section>`}
function fieldsPanel(){const groups=[...new Set(Demo.fields.map(f=>f.group))];return `<aside class="card field-card"><div class="card-head"><h2>可用字段</h2><span class="spacer"></span><span class="small muted-text">点击插入</span></div><div class="card-body" style="padding-bottom:0"><input class="field-search" id="field-search" aria-label="搜索可用字段" placeholder="搜索字段或作用域" value="${esc(fieldQuery)}"></div><div class="field-list">${groups.map(g=>{const fs=Demo.fields.filter(f=>f.group===g&&`${f.label} ${f.token}`.toLowerCase().includes(fieldQuery.toLowerCase()));return fs.length?`<section class="field-group"><h3>${g}</h3>${fs.map(f=>`<button class="field-chip" data-action="insert-field" data-token="${esc(f.token)}"><code>${esc(f.token.slice(1,-1))}</code><small>${esc(f.label)}</small></button>`).join('')}</section>`:''}).join('')}<p class="small muted-text" style="line-height:1.7;margin:13px 3px">属性含空格、点号或与固有字段重名时，字段浏览器自动插入方括号语法。</p></div></aside>`}
function editorPanel(errors,compat){return `<section class="card editor-card"><div class="card-head"><h2>输出列</h2><span class="badge ${compat.cls==='error'?'bad':compat.cls==='warning'?'warn':'good'}">${compat.label}</span><span class="spacer"></span><span class="small muted-text">${draft.columns.length} / 50 列</span></div><div class="compat ${compat.cls}" role="${compat.cls==='error'?'alert':'status'}"><strong>${compat.detail}</strong>${compat.cls==='warning'&&scenario==='normal'?'<br><span>缺值不会移除表达式中的分隔符。</span>':''}</div><div class="columns-head"><span>顺序</span><span>列名</span><span>表达式</span><span>状态</span><span>操作</span></div><div class="columns">${draft.columns.map((c,i)=>`<div class="column-row ${errors[i]?.length?'is-error':''}" data-row="${i}"><span class="drag-handle">${i+1}</span><input data-col="header" data-index="${i}" aria-label="第 ${i+1} 列列名" value="${esc(c.header)}"><div class="expression-wrap"><textarea class="mono" data-col="expression" data-index="${i}" aria-label="${esc(c.header||`第 ${i+1} 列`)}表达式">${esc(c.expression)}</textarea>${errors[i]?.length?`<span class="expression-error" role="alert">${esc(errors[i][0])}</span>`:''}</div><span class="status-cell"><span class="badge ${errors[i]?.length?'bad':'good'}">${errors[i]?.length?'需修正':'有效'}</span></span><span class="row-actions"><button class="small-button" data-action="move-up" data-index="${i}" ${i===0?'disabled':''}>上移</button><button class="small-button" data-action="move-down" data-index="${i}" ${i===draft.columns.length-1?'disabled':''}>下移</button><button class="small-button danger-link" data-action="remove-column" data-index="${i}" ${draft.columns.length===1?'disabled':''}>删除</button></span></div>`).join('')}</div><div class="editor-foot"><button data-action="add-column">添加输出列</button><span class="small muted-text">表达式只支持文字、字段引用和 <span class="mono">{{ / }}</span> 花括号转义。</span></div></section>`}
function previewPanel(errors,compat){const rows=scenario==='empty'?[]:Demo.sheets,can=!blocking()&&scenario!=='loading';const rendered=can?rows.map(s=>draft.columns.map(c=>Demo.evaluate(c.expression,s))):[];return `<section class="card preview-card"><div class="card-head"><h2>结果预览</h2><div class="preview-meta"><span class="small muted-text">${scenario==='empty'?0:Demo.sheets.length} 张图纸 · 最多显示 20 行</span><button class="small-button" data-action="refresh" ${!can?'disabled':''}>刷新预览</button></div></div>${!can?`<div class="empty"><strong>修正模板后才能预览</strong><span>${esc(compat.detail)}</span></div>`:rows.length===0?'<div class="empty"><strong>当前图纸集没有图纸</strong><span>仍可导出仅包含表头的有效 XLSX。</span></div>':`<div class="table-wrap"><table class="preview-table"><thead><tr>${draft.columns.map(c=>`<th>${esc(c.header||'未命名列')}</th>`).join('')}</tr></thead><tbody>${rendered.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}<div class="action-dock"><span class="summary">预览与当前模板草稿、工作区修订一致</span><span class="spacer"></span><button class="primary" data-action="export" ${!can||exporting?'disabled':''}>${exporting?'正在生成…':'导出 XLSX…'}</button></div></section>`}
function render(){const errors=issues(),compat=compatibility(errors);$('app').innerHTML=header()+`<main class="page"><div class="page-head"><div><h2>图纸目录</h2><p class="muted-text">配置输出列并预览真实结果，导出时再选择保存位置。</p></div></div>${templateBar()}<div class="workspace-grid">${fieldsPanel()}${editorPanel(errors,compat)}</div>${previewPanel(errors,compat)}</main>`}
function loadTemplate(id){selected=id;draft=toDraft(templates[id]);saved=JSON.stringify(draft);activeExpression=0;scenario=id==='architecture'?'missing':'normal';render()}
async function saveAs(){const r=await ask('另存为模板','<p>模板保存在应用级设置中，可供其他图纸集调用。</p><label>模板名称<input id="template-name" value="'+esc(draft.name.replace(/（内置）/g,'').trim()+' 副本')+'"></label>',[{label:'取消',value:'cancel'},{label:'保存模板',value:'save',primary:true}]);if(r!=='save')return false;const name=$('template-name')?.value.trim();if(!name){toast('请输入模板名称');return false}const id='user-'+Date.now();templates[id]={id,name,columns:draft.columns.map(c=>[c.header,c.expression])};selected=id;draft=toDraft(templates[id]);saved=JSON.stringify(draft);render();toast('模板已保存，可在其他图纸集中调用');return true}
async function choosePath(){const result=await ask('模拟原生“另存为”','<p>真实桌面应用将在这里打开系统文件选择器。本 Demo 不会创建文件。</p><div class="path-choice" data-action="path-choice" data-value="D:\\项目交付\\滨河市政工程-图纸目录.xlsx"><strong>项目交付文件夹</strong><br><span class="mono small">D:\\项目交付\\滨河市政工程-图纸目录.xlsx</span></div><div class="path-choice" data-action="path-choice" data-value="C:\\Users\\演示用户\\Desktop\\滨河市政工程-图纸目录.xlsx"><strong>桌面</strong><br><span class="mono small">C:\\Users\\演示用户\\Desktop\\滨河市政工程-图纸目录.xlsx</span></div>',[{label:'取消',value:'cancel'}]);if(!result||result==='cancel')return;exporting=true;render();await new Promise(r=>setTimeout(r,700));exporting=false;render();toast(`图纸目录已保存到 ${result}（模拟）`)}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='field-search'){fieldQuery=t.value;render();$('field-search')?.focus();return}const i=Number(t.dataset?.index);if(!Number.isInteger(i)||!t.dataset.col)return;draft.columns[i][t.dataset.col]=t.value;activeExpression=i;render();const next=document.querySelector(`[data-col="${t.dataset.col}"][data-index="${i}"]`);next?.focus();if(t.dataset.col==='expression'&&next instanceof HTMLTextAreaElement)next.setSelectionRange(t.value.length,t.value.length)});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){scenario=e.target.value;render()}if(e.target.id==='template-select'){const id=e.target.value;guard(()=>loadTemplate(id));}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='dialog-choice'){finishAsk(b.dataset.value);return}if(a==='path-choice'){finishAsk(b.dataset.value);return}if(a==='theme'){document.documentElement.classList.toggle('dark');return}if(a==='insert-field'){const i=Math.min(activeExpression,draft.columns.length-1);draft.columns[i].expression+=b.dataset.token;render();document.querySelector(`[data-col="expression"][data-index="${i}"]`)?.focus();return}if(a==='add-column'){draft.columns.push({id:'c'+Date.now(),header:'新列',expression:'{sheet.title}'});activeExpression=draft.columns.length-1;render();document.querySelector(`[data-col="header"][data-index="${activeExpression}"]`)?.focus();return}if(a==='remove-column'){draft.columns.splice(Number(b.dataset.index),1);activeExpression=Math.max(0,activeExpression-1);render();return}if(a==='move-up'||a==='move-down'){const i=Number(b.dataset.index),j=a==='move-up'?i-1:i+1;[draft.columns[i],draft.columns[j]]=[draft.columns[j],draft.columns[i]];activeExpression=j;render();return}if(a==='save-as'){await saveAs();return}if(a==='save'){templates[selected].columns=draft.columns.map(c=>[c.header,c.expression]);templates[selected].name=draft.name;saved=JSON.stringify(draft);render();toast('模板修改已保存（模拟）');return}if(a==='delete-template'){const r=await ask('删除模板','<p>删除“'+esc(draft.name)+'”？历史导出记录不会被删除。</p>',[{label:'取消',value:'cancel'},{label:'删除模板',value:'delete',primary:true}]);if(r==='delete'){delete templates[selected];loadTemplate('default');toast('模板已删除，已回到内置默认模板')}return}if(a==='refresh'){previewState='ready';render();toast('预览已刷新，与当前草稿一致');return}if(a==='export'){await choosePath();return}});
function markActiveColumn(index){document.querySelectorAll('.column-row').forEach((row,i)=>row.classList.toggle('is-active',i===index))}
document.addEventListener('selectionchange',()=>{const t=document.activeElement;if(t?.dataset?.col==='expression'){activeExpression=Number(t.dataset.index);activeCaret=t.selectionStart??0;markActiveColumn(activeExpression)}});
document.addEventListener('input',e=>{const t=e.target;if(t?.dataset?.col!=='expression')return;e.stopImmediatePropagation();const i=Number(t.dataset.index);draft.columns[i].expression=t.value;activeExpression=i;activeCaret=t.selectionStart??t.value.length;render();const next=document.querySelector(`[data-col="expression"][data-index="${i}"]`);next?.focus();next?.setSelectionRange(activeCaret,activeCaret);markActiveColumn(i)},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="insert-field"]');if(!b)return;e.stopImmediatePropagation();const i=Math.min(activeExpression,draft.columns.length-1),value=draft.columns[i].expression;draft.columns[i].expression=value.slice(0,activeCaret)+b.dataset.token+value.slice(activeCaret);activeCaret+=b.dataset.token.length;render();const target=document.querySelector(`[data-col="expression"][data-index="${i}"]`);target?.focus();target?.setSelectionRange(activeCaret,activeCaret);markActiveColumn(i)},true);
$('dialog').addEventListener('cancel',e=>{e.preventDefault();finishAsk('cancel')});
render();
</script>
</body>
</html>
