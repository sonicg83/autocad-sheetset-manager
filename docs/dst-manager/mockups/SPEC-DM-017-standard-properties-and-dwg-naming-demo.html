<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DST Manager · 标准属性与 DWG 命名 Demo</title>
<style>
:root{color-scheme:dark;--canvas:#0c1118;--surface:#141b26;--surface-2:#182231;--surface-3:#202b3b;--text:#e8edf5;--muted:#9ca8ba;--faint:#6f7c90;--border:#273346;--strong:#3a4961;--blue:#7f9cff;--blue-2:#a9baff;--blue-bg:#1d2c50;--green:#6ed7a1;--green-bg:#103223;--amber:#f1c875;--amber-bg:#332810;--red:#ff8f86;--red-bg:#391917;--shadow:0 18px 54px #0008;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;font-size:14px;background:var(--canvas);color:var(--text)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button{min-height:34px;padding:7px 12px;border:1px solid var(--strong);border-radius:7px;background:var(--surface);cursor:pointer;white-space:nowrap}button:hover:not(:disabled){background:var(--surface-3);border-color:#526480}button:disabled{opacity:.42;cursor:not-allowed}.primary{background:var(--blue);border-color:var(--blue);color:#101521;font-weight:650}.primary:hover:not(:disabled){background:var(--blue-2)}.quiet{border-color:transparent;background:transparent;color:var(--muted)}.link{border-color:transparent;background:transparent;color:var(--blue);padding-inline:6px}.danger{border-color:transparent;background:transparent;color:var(--red);padding-inline:6px}.small-button{font-size:12px;min-height:28px;padding:4px 8px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}input,select,textarea{min-width:0;border:1px solid var(--strong);border-radius:7px;background:#111823;padding:8px 10px}input:disabled{color:var(--faint);background:#101620;border-color:var(--border)}input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px}h1,h2,h3,p{margin:0}h1{font-size:17px}h2{font-size:18px}h3{font-size:14px}.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.row{display:flex;align-items:center;gap:8px}.spacer{flex:1}.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:12px;line-height:1.2}.badge.blue{color:var(--blue-2);background:var(--blue-bg)}.badge.good{color:var(--green);background:var(--green-bg)}.badge.warn{color:var(--amber);background:var(--amber-bg)}.badge.bad{color:var(--red);background:var(--red-bg)}[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}.topbar{height:52px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#101620;border-bottom:1px solid var(--border);flex:0 0 auto}.brand{font-size:15px;font-weight:700;letter-spacing:.2px}.product-mark{width:20px;height:20px;border-radius:5px;background:var(--blue);display:grid;place-items:center;color:#101521;font-size:10px;font-weight:800}.main{flex:1;min-height:0;overflow:auto;padding:28px 30px 42px}.shell{width:min(1400px,100%);margin:auto}.page-title{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}.page-title p{margin-top:6px}.identity-card{display:flex;align-items:end;gap:12px;padding:13px 14px;margin-bottom:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.identity-card label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.identity-card input{width:290px}.workspace{display:grid;grid-template-columns:238px minmax(0,1fr);gap:14px;align-items:start}.sidebar,.panel{border:1px solid var(--border);border-radius:10px;background:var(--surface)}.sidebar{padding:9px;position:sticky;top:0}.nav-button{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;text-align:left;border:0;background:transparent;color:var(--muted);min-height:44px;padding:7px 9px;margin:2px 0}.nav-button:hover{background:var(--surface-3)}.nav-button.active{background:var(--blue-bg);color:var(--blue-2);font-weight:650}.nav-index{font-size:12px;color:var(--faint)}.nav-button.active .nav-index{color:var(--blue)}.nav-note{font-size:11px;color:var(--faint)}.sidebar-help{border-top:1px solid var(--border);padding:12px 10px 7px;margin-top:8px;line-height:1.6}.panel{overflow:hidden;min-width:0}.panel-head{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border)}.panel-head p{margin-top:5px;line-height:1.55}.panel-body{padding:16px 18px}.callout{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid #31456d;border-radius:8px;background:#15223d;color:#bccbff;line-height:1.55}.callout.warn{border-color:#63512b;background:var(--amber-bg);color:var(--amber)}.callout.bad{border-color:#71322e;background:var(--red-bg);color:var(--red)}.step-flow{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--faint);font-size:12px}.step-flow .current{color:var(--blue-2)}.step-flow span:not(.flow-arrow){padding:4px 7px;border-radius:5px;background:var(--surface-2)}.flow-arrow{color:var(--strong)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:9px;margin-top:14px}.data-table{border-collapse:collapse;width:100%;min-width:930px}.data-table th,.data-table td{padding:10px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}.data-table th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);white-space:nowrap}.data-table tbody tr:last-child td{border-bottom:0}.data-table tbody tr:hover td{background:#182131}.data-table input,.data-table select{width:100%;height:36px}.checkbox-hit{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:6px;cursor:pointer}.checkbox-hit:hover{background:var(--surface-3)}.data-table input[type=checkbox]{width:16px;height:16px;padding:0;margin:0;flex:none}.data-table .name{min-width:150px}.data-table .scope{width:110px}.data-table .type{width:105px}.data-table .required{width:66px;text-align:center}.data-table .default{min-width:130px}.data-table .enum-cell{min-width:170px}.data-table .description{min-width:170px}.data-table .actions{width:70px;text-align:center}.enum-trigger{width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;color:var(--blue-2);background:#101823}.disabled-field{width:100%;height:36px;border:1px solid var(--border);border-radius:7px;background:#101620;color:var(--faint);display:flex;align-items:center;padding:0 10px}.table-foot{display:flex;align-items:center;gap:10px;margin-top:12px}.dependency-note{margin-left:auto;font-size:12px;color:var(--muted)}
.derived-list{display:grid;gap:10px;margin-top:14px}.derived-row{display:grid;grid-template-columns:minmax(130px,1fr) 105px minmax(180px,1.15fr) 92px minmax(160px,1fr) 58px 58px;gap:9px;align-items:center;padding:11px;border:1px solid var(--border);border-radius:9px;background:#121a25}.derived-row.header{padding:0 11px;border:0;background:transparent;color:var(--muted);font-size:12px}.derived-row input,.derived-row select{width:100%;height:36px}.source-summary{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.section-footnote{margin-top:14px;padding-top:13px;border-top:1px solid var(--border);line-height:1.6}
.naming-grid,.composer-grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;margin-top:14px}.field-browser,.editor-card,.preview-card{border:1px solid var(--border);border-radius:9px;background:#121a25}.field-browser{padding:13px}.field-browser h3{margin-bottom:10px}.field-browser input{width:100%;margin-bottom:9px}.field-group{margin-top:12px}.field-group-title{font-size:12px;color:var(--muted);margin-bottom:5px}.field-button{display:block;width:100%;text-align:left;border-color:transparent;background:transparent;padding:7px 8px;min-height:34px;white-space:normal}.field-button:hover{background:var(--blue-bg);color:var(--blue-2)}.field-button code{font-size:12px}.field-button small{display:block;color:var(--faint);margin-top:2px}.editor-stack{display:grid;gap:12px}.editor-card{padding:14px}.editor-label{font-size:12px;color:var(--muted);margin-bottom:7px}.token-editor{min-height:44px;display:flex;align-items:center;gap:5px;overflow-x:auto;padding:5px;border:1px solid var(--strong);border-radius:8px;background:#0f1722}.token{display:inline-flex;align-items:center;min-height:30px;padding:5px 8px;border-radius:6px;background:var(--blue-bg);color:var(--blue-2);font:12px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap}.literal{min-width:92px;flex:1;border:0;background:transparent;padding:6px}.literal:focus{outline:0}.editor-actions{display:flex;align-items:center;gap:8px;margin-top:9px}.preview-card{overflow:hidden}.preview-head{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border)}.preview-content{padding:17px}.filename{font-size:18px;font-weight:650;word-break:break-all}.sample-values{display:grid;grid-template-columns:repeat(2,minmax(160px,1fr));gap:7px 18px;margin-top:15px;color:var(--muted);font-size:12px}.sample-values div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--border);padding-bottom:5px}.sample-values code{color:var(--text)}
dialog{padding:0;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);width:min(880px,calc(100vw - 32px));max-height:calc(100vh - 42px);overflow:hidden}dialog::backdrop{background:#05080db8}dialog.composer-dialog{width:min(1040px,calc(100vw - 32px))}.dialog-shell{display:flex;flex-direction:column;max-height:calc(100vh - 44px);min-height:0;overflow:hidden}.dialog-head{display:flex;flex:0 0 auto;align-items:flex-start;gap:12px;padding:17px 19px;border-bottom:1px solid var(--border)}.dialog-head p{margin-top:5px}.dialog-body{padding:17px 19px;flex:1 1 auto;min-height:0;overflow:auto}.dialog-foot{display:flex;flex:0 0 auto;align-items:center;justify-content:flex-end;gap:8px;padding:13px 19px;border-top:1px solid var(--border);background:#111823}.enum-list{display:grid;gap:8px;margin-top:13px}.enum-row{display:grid;grid-template-columns:96px minmax(170px,1fr) minmax(180px,1fr) 62px;gap:8px;align-items:center}.enum-order{display:flex;align-items:center;gap:4px}.enum-sequence{width:22px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}.reorder-button{width:28px;min-height:28px;padding:0;display:grid;place-items:center}.enum-id{font-size:11px;color:var(--faint)}.mapping-grid{display:grid;grid-template-columns:minmax(160px,.8fr) minmax(200px,1fr);gap:8px;margin-top:12px}.mapping-grid .map-head{font-size:12px;color:var(--muted);padding:2px 8px}.source-value{padding:9px 10px;border:1px solid var(--border);border-radius:7px;background:#101620}.mapping-grid input{width:100%}.modal-field{display:grid;gap:6px;margin-bottom:12px}.modal-field label{font-size:12px;color:var(--muted)}.modal-field select{width:100%}.composer-dialog .composer-grid{margin-top:0}.composer-dialog .field-browser{max-height:380px;overflow:auto}.composer-dialog .preview-content{min-height:86px}.toast{position:fixed;z-index:50;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 15px;border-radius:8px;background:#edf1f7;color:#151a23;box-shadow:var(--shadow);font-size:13px}.toast:empty{display:none}
@media(max-width:1050px){.main{padding:18px}.workspace{grid-template-columns:210px minmax(0,1fr)}.derived-row{grid-template-columns:minmax(130px,1fr) 90px minmax(150px,1fr) 82px 58px 58px}.derived-row .derived-description,.derived-row.header .derived-description{display:none}.naming-grid,.composer-grid{grid-template-columns:230px minmax(0,1fr)}}
@media(max-width:780px){html,body{height:auto;min-height:100%;overflow:auto}.topbar{position:sticky;top:0;z-index:5}.main{padding:14px}.page-title,.identity-card{flex-wrap:wrap}.identity-card label,.identity-card input{width:100%}.workspace{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow-x:auto}.nav-button{min-width:160px}.sidebar-help{display:none}.naming-grid,.composer-grid{grid-template-columns:1fr}.field-browser{max-height:240px;overflow:auto}.derived-row{grid-template-columns:1fr 90px 96px 58px 58px}.derived-row .source-summary,.derived-row.header .source-summary{display:none}.sample-values{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
// 本文件是 SPEC-DM-017 的交互对照 Demo；全部数据均为去敏虚构数据，不调用 API，也不写入文件。
const Demo=(()=>{
  const sections=[
    ['basic','1','基本信息'],['ordinary','2','普通属性'],['derived','3','派生属性'],
    ['naming','4','DWG 命名'],['assets','5','模板资产'],['publish','6','版本与发布']
  ];
  const ordinary=[
    {id:'p-project',name:'项目名称',scope:'sheetset',type:'text',required:true,def:'滨河市政工程',enumItems:[],description:'图纸集显示名称'},
    {id:'p-discipline',name:'专业代码',scope:'sheetset',type:'enum',required:true,def:'RQ',enumItems:[['e-rq','RQ','燃气'],['e-dl','DL','道路'],['e-ps','PS','排水']],description:'项目专业分类'},
    {id:'p-stage',name:'图纸阶段',scope:'sheet',type:'enum',required:true,def:'施工图',enumItems:[['e-sg','施工图','正式出图'],['e-bg','变更图','设计变更'],['e-jg','竣工图','竣工归档']],description:'单张图纸阶段'},
    {id:'p-designer',name:'设计人',scope:'sheet',type:'text',required:false,def:'',enumItems:[],description:'责任设计人'}
  ];
  const derived=[
    {id:'d-discipline-name',name:'专业名称',scope:'sheetset',type:'mapping',source:'p-discipline',description:'由专业代码映射中文名称',map:{'e-rq':'燃气','e-dl':'道路','e-ps':'排水'},pending:false},
    {id:'d-sheet-label',name:'图名标识',scope:'sheet',type:'composition',description:'图号与图名的只读组合',tokens:[['field','sheet.number'],['text',' '],['field','sheet.title']]}
  ];
  const state={section:'ordinary',dirty:false,modal:null,query:'',naming:[['field','sheetset.专业代码'],['text','-'],['field','subset.scope'],['text',' '],['field','subset.name']]};
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const property=id=>ordinary.find(p=>p.id===id);
  function toast(message){$('toast').textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',2600)}
  function setDirty(){state.dirty=true;renderTopState()}
  function renderTopState(){const el=$('save-state');if(el){el.textContent=state.dirty?'有未保存修改':'草稿已保存';el.className='badge '+(state.dirty?'warn':'good')}}
  function sidebar(){return `<aside class="sidebar" aria-label="标准编辑分区">${sections.map(([id,n,label])=>`<button class="nav-button ${state.section===id?'active':''}" data-action="section" data-section="${id}"><span class="nav-index">${n}</span><span>${label}</span>${id==='ordinary'?'<span class="nav-note">4</span>':id==='derived'?'<span class="nav-note">2</span>':''}</button>`).join('')}<div class="sidebar-help small muted">属性按定义顺序逐层求值。<br>创建后的绑定标准工作区约束已登记为后续 Todo。</div></aside>`}
  function header(title,desc,action=''){return `<div class="panel-head"><div><h2>${title}</h2><p class="muted">${desc}</p></div><div class="spacer"></div>${action}</div>`}
  function ordinaryView(){return `<section class="panel">${header('普通属性','先定义可直接填写的文本或枚举属性；属性名在全部作用域和类型中全局唯一。','<button data-action="add-ordinary">新增属性</button>')}<div class="panel-body"><div class="step-flow"><span class="current">普通属性</span><b class="flow-arrow">→</b><span>映射属性</span><b class="flow-arrow">→</b><span>组合属性</span><b class="flow-arrow">→</b><span>DWG 命名</span></div><div class="callout"><div><strong>稳定身份与兼容约束</strong><br><span class="small">属性改名保留历史名称；作用域和普通/派生类型创建后不可直接转换。删除被引用属性时会阻断并列出引用方。</span></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>属性名</th><th>作用域</th><th>类型</th><th>必填</th><th>默认值</th><th>枚举值</th><th>说明</th><th>删除</th></tr></thead><tbody>${ordinary.map((p,i)=>`<tr><td class="name"><input data-kind="ordinary" data-index="${i}" data-field="name" value="${esc(p.name)}" aria-label="属性名"></td><td class="scope"><select data-kind="ordinary" data-index="${i}" data-field="scope" aria-label="作用域"><option value="sheetset" ${p.scope==='sheetset'?'selected':''}>sheetset</option><option value="sheet" ${p.scope==='sheet'?'selected':''}>sheet</option></select></td><td class="type"><select data-kind="ordinary" data-index="${i}" data-field="type" aria-label="类型"><option value="text" ${p.type==='text'?'selected':''}>文本</option><option value="enum" ${p.type==='enum'?'selected':''}>枚举</option></select></td><td class="required"><label class="checkbox-hit"><input type="checkbox" data-kind="ordinary" data-index="${i}" data-field="required" ${p.required?'checked':''} aria-label="必填"></label></td><td class="default"><input data-kind="ordinary" data-index="${i}" data-field="def" value="${esc(p.def)}" placeholder="无默认值" aria-label="默认值"></td><td class="enum-cell">${p.type==='enum'?`<button class="enum-trigger" data-action="edit-enum" data-index="${i}" title="编辑枚举值">${p.enumItems.map(x=>esc(x[1])).join(' / ')||'设置枚举值'}</button>`:'<div class="disabled-field">仅枚举类型可用</div>'}</td><td class="description"><input data-kind="ordinary" data-index="${i}" data-field="description" value="${esc(p.description)}" aria-label="说明"></td><td class="actions"><button class="danger" data-action="delete-ordinary" data-index="${i}">删除</button></td></tr>`).join('')}</tbody></table></div><div class="table-foot"><button data-action="add-ordinary">新增属性</button><span class="dependency-note">CSV 导入也写入同一普通属性模型，不产生第二套规则。</span></div></div></section>`}
  function derivedView(){return `<section class="panel">${header('派生属性','映射和组合都是只读计算结果；成功求值后物化为 DST 文本属性。','<button data-action="add-derived">新增派生属性</button>')}<div class="panel-body"><div class="callout"><div><strong>固定求值链</strong><br><span class="small">普通属性 → 映射属性 → 组合属性。任何上游错误都会停止物化，不使用遗留旧值。</span></div></div><div class="derived-list"><div class="derived-row header"><span>属性名</span><span>作用域</span><span class="source-summary">源属性摘要</span><span>类型</span><span class="derived-description">说明</span><span>编辑</span><span>删除</span></div>${derived.map((d,i)=>`<div class="derived-row"><input value="${esc(d.name)}" data-kind="derived" data-index="${i}" data-field="name" aria-label="派生属性名"><select data-kind="derived" data-index="${i}" data-field="scope" aria-label="作用域"><option value="sheetset" ${d.scope==='sheetset'?'selected':''}>sheetset</option><option value="sheet" ${d.scope==='sheet'?'selected':''}>sheet</option></select><div class="source-summary" title="${esc(sourceSummary(d))}">${esc(sourceSummary(d))}${d.pending?' · 待确认':''}</div><select data-kind="derived" data-index="${i}" data-field="type" aria-label="类型"><option value="mapping" ${d.type==='mapping'?'selected':''}>映射</option><option value="composition" ${d.type==='composition'?'selected':''}>组合</option></select><input class="derived-description" value="${esc(d.description)}" data-kind="derived" data-index="${i}" data-field="description" aria-label="说明"><button class="link" data-action="edit-derived" data-index="${i}">编辑</button><button class="danger" data-action="delete-derived" data-index="${i}">删除</button></div>`).join('')}</div><div class="section-footnote small muted"><strong>作用域约束：</strong>sheetset 派生属性只能引用 sheetset 输入；sheet 派生属性可引用 sheetset 和 sheet 输入。组合属性不能引用其他组合属性，从结构上避免循环。</div></div></section>`}
  function sourceSummary(d){if(d.type==='mapping')return `枚举：${property(d.source)?.name||'未选择'}`;return (d.tokens||[]).filter(x=>x[0]==='field').map(x=>x[1]).join(' + ')||'尚未配置'}
  function fieldButton(token,label,desc){return `<button class="field-button" data-action="insert-token" data-token="${esc(token)}"><code>${esc(token)}</code><small>${esc(label)} · ${esc(desc)}</small></button>`}
  function fieldBrowser(mode='naming'){const groups=mode==='naming'?[['子集系统字段',[['subset.scope','子集图号范围','001-003'],['subset.name','子集名称','示例子集'],['subset.sequence:02','子集物理顺序','01']]],['sheetset 属性',[['sheetset.项目名称','项目名称','滨河市政工程'],['sheetset.专业代码','专业代码','RQ'],['sheetset.专业名称','专业名称（映射）','燃气']]]]:[['图纸系统字段',[['sheet.number','图号','001'],['sheet.title','图名','管道平面图']]],['可用属性',[['sheetset.项目名称','项目名称','滨河市政工程'],['sheetset.专业名称','专业名称（映射）','燃气'],['sheet.图纸阶段','图纸阶段','施工图']]]];return `<aside class="field-browser"><h3>字段浏览器</h3><input placeholder="搜索字段或作用域" aria-label="搜索字段">${groups.map(g=>`<div class="field-group"><div class="field-group-title">${g[0]}</div>${g[1].map(x=>fieldButton(x[0],x[1],x[2])).join('')}</div>`).join('')}</aside>`}
  function tokensHtml(tokens){return tokens.map((t,i)=>t[0]==='field'?`<span class="token" title="双击移除字段" data-token-index="${i}">{${esc(t[1])}}</span>`:`<span class="token" title="双击移除文本" data-token-index="${i}">“${esc(t[1])}”</span>`).join('')}
  function namingPreview(){const map={'sheetset.专业代码':'RQ','sheetset.项目名称':'滨河市政工程','sheetset.专业名称':'燃气','subset.scope':'001-003','subset.name':'示例子集','subset.sequence:02':'01'};return state.naming.map(t=>t[0]==='text'?t[1]:(map[t[1]]??'')).join('')+'.dwg'}
  function namingView(){const unique=state.naming.some(t=>t[0]==='field'&&(t[1].startsWith('subset.scope')||t[1].startsWith('subset.sequence')));return `<section class="panel">${header('DWG 命名','全项目只使用一条模板；可用字段限于子集系统字段和 sheetset 属性。','<button class="quiet small-button" data-action="load-risk">载入风险示例</button>')}<div class="panel-body">${unique?'<div class="callout"><div><strong>示例预览，不代表具体工程结果</strong><br><span class="small">创建图纸集前会使用真实 sheetset 值和全部子集统一检查非法文件名与大小写不敏感碰撞。</span></div></div>':'<div class="callout warn"><div><strong>可能产生重名</strong><br><span class="small">模板同时缺少 subset.sequence 和 subset.scope。可保存草稿，但发布检查会显示 warning；实际碰撞将阻止创建。</span></div></div>'}<div class="naming-grid">${fieldBrowser('naming')}<div class="editor-stack"><div class="editor-card"><div class="editor-label">文件名主体模板</div><div class="token-editor" id="naming-editor" tabindex="0" aria-label="DWG 文件名主体模板">${tokensHtml(state.naming)}<input id="literal-input" class="literal" placeholder="输入固定文字后按 Enter"></div><div class="editor-actions"><span class="small muted">字段从左侧插入；双击令牌可移除。扩展名由系统固定追加。</span><span class="spacer"></span><button class="small-button" data-action="reset-naming">恢复默认</button><button class="small-button" data-action="clear-tokens">清空</button></div></div><div class="preview-card"><div class="preview-head"><strong>示例预览</strong><span class="badge good">文件名有效</span></div><div class="preview-content"><div class="filename mono">${esc(namingPreview())}</div><div class="sample-values"><div><span>subset.sequence</span><code>1</code></div><div><span>subset.scope</span><code>001-003</code></div><div><span>subset.name</span><code>示例子集</code></div><div><span>sheetset.专业代码</span><code>RQ</code></div></div></div></div></div></div><div class="section-footnote small muted">禁止引用 sheet 属性；不自动清理 Windows 非法字符。输出为空、含路径片段、保留设备名、尾随空格/句点或超过 240 字符时直接报告错误。</div></div></section>`}
  function placeholderView(id){const copy={basic:['基本信息','标准名称、身份、版本、CAD 版本与编号策略继续沿用 SPEC-DM-016。'],assets:['模板资产','基础模板与布局模板检查继续沿用已实现的资产分区。'],publish:['版本与发布','集中显示结构错误、映射待确认 warning、命名重名风险与资产诊断。']}[id];return `<section class="panel">${header(copy[0],copy[1])}<div class="panel-body"><div class="callout"><div><strong>本 Demo 聚焦 SPEC-DM-017 的新增设计</strong><br><span class="small">请从左侧进入“普通属性”“派生属性”或“DWG 命名”。本分区继续复用 PLAN-DM-035 已完成的界面。</span></div></div></div></section>`}
  function content(){return state.section==='ordinary'?ordinaryView():state.section==='derived'?derivedView():state.section==='naming'?namingView():placeholderView(state.section)}
  function render(){const app=$('app');app.innerHTML=`<header class="topbar"><span class="product-mark">DM</span><span class="brand">DST Manager</span><span class="muted">/ 图纸标准</span><span class="spacer"></span><button class="quiet small-button">设置</button></header><main class="main"><div class="shell"><div class="page-title"><div><h1>编辑标准 · 市政工程图纸标准</h1><p class="muted">先定义属性语义，再配置派生关系和全局 DWG 命名。</p></div><span id="save-state" class="badge good">草稿已保存</span><span class="badge blue">Schema v1</span><span class="spacer"></span><button>返回标准库</button></div><div class="identity-card"><label>标准名称<input value="市政工程图纸标准"></label><label>草稿版本<input value="1.0.0" disabled></label><div class="spacer"></div><span class="small muted">draft-municipal-v1</span><button data-action="save">保存草稿</button><button class="primary" data-action="publish">发布检查</button></div><div class="workspace">${sidebar()}${content()}</div></div></main>`;renderTopState()}
  function setDialogMode(className=''){const dialog=$('dialog');dialog.className=className}
  function syncEnumInputs(){if(state.modal?.type!=='enum')return;document.querySelectorAll('[data-enum-index]').forEach(input=>state.modal.enumItems[Number(input.dataset.enumIndex)][Number(input.dataset.enumField)]=input.value)}
  function renderEnumDialog(){const p=ordinary[state.modal.index],items=state.modal.enumItems;setDialogMode();$('dialog-content').innerHTML=`<div class="dialog-shell"><div class="dialog-head"><div><h2>编辑枚举值 · ${esc(p.name)}</h2><p class="muted">列表从上到下就是枚举顺序；内部稳定 ID 不在界面中展示。改名保留映射结果，增删、改名或排序后需要重新确认映射。</p></div><div class="spacer"></div><span class="badge blue">${p.scope}</span></div><div class="dialog-body"><div class="callout warn"><div><strong>影响 1 个映射属性：专业名称</strong><br><span class="small">保存后该映射会进入“待确认”状态，发布检查显示 warning。</span></div></div><div class="enum-list"><div class="enum-row small muted"><span>顺序</span><span>枚举值</span><span>说明</span><span>删除</span></div>${items.map((x,i)=>`<div class="enum-row"><div class="enum-order"><span class="enum-sequence">${String(i+1).padStart(2,'0')}</span><button class="reorder-button" data-action="move-enum-up" data-index="${i}" aria-label="上移枚举值 ${esc(x[1]||i+1)}" title="上移" ${i===0?'disabled':''}>↑</button><button class="reorder-button" data-action="move-enum-down" data-index="${i}" aria-label="下移枚举值 ${esc(x[1]||i+1)}" title="下移" ${i===items.length-1?'disabled':''}>↓</button></div><input data-enum-index="${i}" data-enum-field="1" value="${esc(x[1])}" aria-label="枚举值"><input data-enum-index="${i}" data-enum-field="2" value="${esc(x[2])}" aria-label="枚举说明"><button class="danger" data-action="delete-enum" data-index="${i}">删除</button></div>`).join('')}</div><button style="margin-top:12px" data-action="add-enum">新增枚举值</button></div><div class="dialog-foot"><button data-action="close-dialog">取消</button><button class="primary" data-action="save-enum">保存枚举值</button></div></div>`;if(!$('dialog').open)$('dialog').showModal()}
  function enumDialog(index){state.modal={type:'enum',index,enumItems:ordinary[index].enumItems.map(x=>[...x])};renderEnumDialog()}
  function mappingDialog(index){const d=derived[index],source=property(d.source)||ordinary.find(p=>p.type==='enum');state.modal={type:'mapping',index};setDialogMode();$('dialog-content').innerHTML=`<div class="dialog-shell"><div class="dialog-head"><div><h2>编辑映射属性 · ${esc(d.name)}</h2><p class="muted">源值由普通枚举属性自动预填，不能在这里新增、删除或排序。</p></div><div class="spacer"></div>${d.pending?'<span class="badge warn">枚举已变化，待确认</span>':'<span class="badge good">映射完整</span>'}</div><div class="dialog-body"><div class="modal-field"><label>源属性（仅普通枚举，且每个源只能被一个映射使用）</label><select id="mapping-source">${ordinary.filter(p=>p.type==='enum'&&(d.scope==='sheet'||p.scope==='sheetset')).map(p=>`<option value="${p.id}" ${p.id===d.source?'selected':''} ${derived.some((x,j)=>j!==index&&x.type==='mapping'&&x.source===p.id)?'disabled':''}>${esc(p.name)} · ${p.scope}${derived.some((x,j)=>j!==index&&x.type==='mapping'&&x.source===p.id)?'（已被占用）':''}</option>`).join('')}</select></div><div class="mapping-grid"><div class="map-head">源枚举值（只读）</div><div class="map-head">映射结果</div>${source.enumItems.map(x=>`<div class="source-value"><span>${esc(x[1])}</span></div><input data-map-id="${esc(x[0])}" value="${esc(d.map?.[x[0]]||'')}" placeholder="必填" aria-label="${esc(x[1])} 的映射结果">`).join('')}</div></div><div class="dialog-foot"><span class="small muted" style="margin-right:auto">多个源值可以映射为同一结果。</span><button data-action="close-dialog">取消</button><button class="primary" data-action="save-mapping">确认映射</button></div></div>`;if(!$('dialog').open)$('dialog').showModal()}
  function compositionDialog(index){const d=derived[index];state.modal={type:'composition',index,tokens:(d.tokens||[]).map(x=>[...x])};setDialogMode('composer-dialog');$('dialog-content').innerHTML=`<div class="dialog-shell"><div class="dialog-head"><div><h2>编辑组合属性 · ${esc(d.name)}</h2><p class="muted">字段必须从浏览器插入；固定文字可直接输入。组合属性不能引用其他组合属性。</p></div><div class="spacer"></div><span class="badge blue">${d.scope}</span></div><div class="dialog-body"><div class="composer-grid">${fieldBrowser('composition')}<div class="editor-stack"><div class="editor-card"><div class="editor-label">组合表达式（单行）</div><div class="token-editor" id="composition-editor" tabindex="0">${tokensHtml(state.modal.tokens)}<input id="modal-literal-input" class="literal" placeholder="输入固定文字后按 Enter"></div><div class="editor-actions"><span class="small muted">双击令牌可移除。</span><span class="spacer"></span><button class="small-button" data-action="clear-composition">清空</button></div></div><div class="preview-card"><div class="preview-head"><strong>实时预览</strong><span class="badge good">可计算</span></div><div class="preview-content"><div id="composition-preview" class="filename">${esc(compositionPreview(state.modal.tokens))}</div><p class="small muted" style="margin-top:10px">示例：sheet.number = 001，sheet.title = 管道平面图</p></div></div></div></div></div><div class="dialog-foot"><button data-action="close-dialog">取消</button><button class="primary" data-action="save-composition">保存组合</button></div></div>`;if(!$('dialog').open)$('dialog').showModal()}
  function compositionPreview(tokens){const map={'sheet.number':'001','sheet.title':'管道平面图','sheetset.项目名称':'滨河市政工程','sheetset.专业名称':'燃气','sheet.图纸阶段':'施工图'};return tokens.map(t=>t[0]==='text'?t[1]:(map[t[1]]??'')).join('')||'（空）'}
  function refreshComposer(){if(!state.modal||state.modal.type!=='composition')return;const editor=$('composition-editor');editor.innerHTML=tokensHtml(state.modal.tokens)+'<input id="modal-literal-input" class="literal" placeholder="输入固定文字后按 Enter">';$('composition-preview').textContent=compositionPreview(state.modal.tokens)}
  function closeDialog(){$('dialog').close();setDialogMode();state.modal=null}
  function addToken(token){const target=state.modal?.type==='composition'?state.modal.tokens:state.naming;target.push(['field',token]);setDirty();if(state.modal?.type==='composition')refreshComposer();else render()}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='section'){state.section=b.dataset.section;render();return}if(a==='save'){state.dirty=false;renderTopState();toast('草稿已保存（模拟）');return}if(a==='publish'){state.section='publish';render();toast('已进入发布检查（模拟）');return}if(a==='edit-enum'){enumDialog(Number(b.dataset.index));return}if(a==='edit-derived'){const i=Number(b.dataset.index);derived[i].type==='mapping'?mappingDialog(i):compositionDialog(i);return}if(a==='close-dialog'){closeDialog();return}if(a==='add-enum'){syncEnumInputs();state.modal.enumItems.push(['e-'+crypto.randomUUID(),'','']);renderEnumDialog();return}if(a==='delete-enum'){syncEnumInputs();state.modal.enumItems.splice(Number(b.dataset.index),1);renderEnumDialog();return}if(a==='move-enum-up'||a==='move-enum-down'){syncEnumInputs();const from=Number(b.dataset.index),to=a==='move-enum-up'?from-1:from+1;state.modal.enumItems.splice(to,0,state.modal.enumItems.splice(from,1)[0]);renderEnumDialog();return}if(a==='save-enum'){syncEnumInputs();const p=ordinary[state.modal.index];p.enumItems=state.modal.enumItems.map(x=>[...x]);derived.filter(d=>d.type==='mapping'&&d.source===p.id).forEach(d=>d.pending=true);setDirty();closeDialog();render();toast('枚举值已保存；相关映射需要确认');return}if(a==='save-mapping'){const d=derived[state.modal.index];d.source=$('mapping-source').value;d.map={};document.querySelectorAll('[data-map-id]').forEach(input=>d.map[input.dataset.mapId]=input.value);d.pending=false;setDirty();closeDialog();render();toast('映射已确认');return}if(a==='save-composition'){derived[state.modal.index].tokens=state.modal.tokens.map(x=>[...x]);setDirty();closeDialog();render();toast('组合表达式已保存');return}if(a==='insert-token'){addToken(b.dataset.token);return}if(a==='clear-composition'){state.modal.tokens=[];refreshComposer();return}if(a==='clear-tokens'){state.naming=[];setDirty();render();return}if(a==='reset-naming'){state.naming=[['field','subset.scope'],['text',' '],['field','subset.name']];setDirty();render();return}if(a==='load-risk'){state.naming=[['field','sheetset.专业代码'],['text','-'],['field','subset.name']];setDirty();render();return}if(a==='add-ordinary'){ordinary.push({id:'p-'+Date.now(),name:'新属性',scope:'sheet',type:'text',required:false,def:'',enumItems:[],description:''});setDirty();render();return}if(a==='delete-ordinary'){const i=Number(b.dataset.index),p=ordinary[i],refs=derived.filter(d=>d.source===p.id);if(refs.length){toast(`无法删除：被派生属性“${refs[0].name}”引用`);return}ordinary.splice(i,1);setDirty();render();return}if(a==='add-derived'){derived.push({id:'d-'+Date.now(),name:'新派生属性',scope:'sheet',type:'composition',description:'',tokens:[]});setDirty();render();return}if(a==='delete-derived'){derived.splice(Number(b.dataset.index),1);setDirty();render();return}});
  document.addEventListener('change',e=>{const t=e.target;if(t.dataset.kind==='ordinary'){const p=ordinary[Number(t.dataset.index)],field=t.dataset.field;p[field]=field==='required'?t.checked:t.value;if(field==='type'&&t.value==='text')p.enumItems=[];setDirty();render()}if(t.dataset.kind==='derived'){const d=derived[Number(t.dataset.index)];d[t.dataset.field]=t.value;if(t.dataset.field==='type'){if(t.value==='mapping'){d.source=ordinary.find(p=>p.type==='enum')?.id;d.map={}}else d.tokens=[]}setDirty();render()}});
  document.addEventListener('input',e=>{const t=e.target;if(t.dataset.kind==='ordinary'&&['name','def','description'].includes(t.dataset.field)){ordinary[Number(t.dataset.index)][t.dataset.field]=t.value;setDirty()}if(t.dataset.kind==='derived'&&['name','description'].includes(t.dataset.field)){derived[Number(t.dataset.index)][t.dataset.field]=t.value;setDirty()}});
  document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!['literal-input','modal-literal-input'].includes(e.target.id))return;e.preventDefault();const value=e.target.value;if(!value)return;if(e.target.id==='modal-literal-input'){state.modal.tokens.push(['text',value]);refreshComposer()}else{state.naming.push(['text',value]);setDirty();render()}});
  document.addEventListener('dblclick',e=>{const token=e.target.closest('[data-token-index]');if(!token)return;const target=state.modal?.type==='composition'?state.modal.tokens:state.naming;target.splice(Number(token.dataset.tokenIndex),1);setDirty();if(state.modal?.type==='composition')refreshComposer();else render()});
  $('dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
  render();
  return {state,ordinary,derived,render};
})();
</script>
</body>
</html>
