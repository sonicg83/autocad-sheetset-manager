<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>DST Manager · Multilingual UI Demo</title>
<style>
:root{color-scheme:light;--canvas:#f5f7fa;--surface:#fff;--surface2:#f8fafc;--text:#182235;--muted:#607086;--border:#dfe5ed;--strong:#b7c2d0;--blue:#315fd8;--bluebg:#edf2ff;--green:#197249;--greenbg:#e7f5ed;--amber:#8a5c00;--amberbg:#fff5db;--red:#b6322e;--redbg:#fcebea;--shadow:0 18px 56px #15213b24;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:14px;background:var(--canvas);color:var(--text)}
html.dark{color-scheme:dark;--canvas:#0f151e;--surface:#171f2b;--surface2:#121923;--text:#e7ebf2;--muted:#a9b4c4;--border:#303c4e;--strong:#59677d;--blue:#91abff;--bluebg:#203052;--green:#75dda8;--greenbg:#123020;--amber:#efca80;--amberbg:#342711;--red:#ff9c95;--redbg:#3b1918;--shadow:0 18px 56px #0008}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden}button,select,input{font:inherit;color:inherit}button,select{min-height:36px;border:1px solid var(--strong);border-radius:8px;background:var(--surface);padding:7px 12px}button{cursor:pointer}button:hover{background:var(--surface2)}button:disabled{opacity:.48;cursor:not-allowed}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:hover{filter:brightness(1.05);background:var(--blue)}html.dark .primary{color:#101622}.quiet{border-color:transparent;background:transparent}.icon-button{display:inline-flex;align-items:center;gap:7px}.icon-button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}.spacer{flex:1}h1,h2,h3,p{margin:0}button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.app{height:100%;display:flex;flex-direction:column}.topbar{height:58px;flex:0 0 auto;display:flex;align-items:center;gap:13px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{font-size:16px;font-weight:680}.workspace-name{font-weight:600}.path{max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}.pill{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:12px;white-space:nowrap}.tabs{height:46px;display:flex;align-items:end;gap:4px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}.tab{border:0;border-radius:7px 7px 0 0;background:transparent;color:var(--muted);padding:10px 16px}.tab.active{color:var(--blue);background:var(--bluebg);font-weight:650}.body{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr;gap:14px;padding:16px 20px}.tree,.content{min-width:0;border:1px solid var(--border);border-radius:11px;background:var(--surface);overflow:hidden}.tree{padding:14px}.tree h2,.content h2{font-size:15px}.tree-item{margin-top:12px;padding:9px 10px;border-radius:7px;background:var(--bluebg);color:var(--blue)}.content{display:flex;flex-direction:column}.content-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}.table-wrap{overflow:auto}.table{min-width:720px}.tr{display:grid;grid-template-columns:90px minmax(190px,1fr) minmax(240px,1.2fr);border-bottom:1px solid var(--border)}.tr>span{padding:11px 14px;min-width:0;overflow-wrap:anywhere}.tr.header{font-size:12px;color:var(--muted);background:var(--surface2)}
.demo-tools{position:fixed;left:18px;bottom:16px;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);font-size:12px}.demo-tools label{color:var(--muted)}
dialog{padding:0;width:780px;max-width:calc(100vw - 26px);height:min(650px,88vh);border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:#0e172a73}.dialog-shell{height:100%;display:flex;flex-direction:column}.dialog-head,.dialog-foot{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding:14px 18px}.dialog-head{border-bottom:1px solid var(--border)}.dialog-head h2{font-size:17px}.dialog-foot{border-top:1px solid var(--border)}.dialog-body{flex:1;min-height:0;display:grid;grid-template-columns:155px 1fr}.side{padding:12px 10px;border-right:1px solid var(--border)}.side button{width:100%;border:0;text-align:left;background:transparent;color:var(--muted);margin-bottom:4px}.side button.selected{background:var(--bluebg);color:var(--blue);font-weight:650}.panel{overflow:auto;padding:18px 22px;scroll-padding:18px}.group{margin-bottom:22px}.group-title{font-size:13px;font-weight:700;border-left:3px solid var(--blue);padding-left:8px;margin-bottom:12px}.field{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 14px;padding:12px;border:1px solid transparent;border-radius:9px}.field.dirty{border-color:var(--amber);background:var(--amberbg)}.field.error{border-color:var(--red);background:var(--redbg)}.field-label{font-weight:600;padding-top:3px}.field-main{min-width:0}.radios{display:flex;flex-wrap:wrap;gap:8px 18px}.radios label{display:flex;align-items:center;gap:6px;min-height:30px}.hint{color:var(--muted);font-size:12px;line-height:1.55;margin-top:6px}.source{display:inline-flex;margin-top:8px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:12px}.error-summary{border:1px solid var(--red);border-radius:9px;background:var(--redbg);color:var(--red);padding:12px 14px;margin-bottom:14px;line-height:1.55}.error-summary a{color:inherit;font-weight:650}.inline-error{color:var(--red);font-size:12px;margin-top:7px}.saved{color:var(--green);background:var(--greenbg);padding:4px 9px;border-radius:999px;font-size:12px}.notice{border:1px solid var(--border);border-radius:9px;background:var(--surface2);padding:12px 14px;line-height:1.6}.detail{margin-top:8px;color:var(--muted);overflow-wrap:anywhere}.status-text{color:var(--muted);font-size:12px}.long-copy{line-height:1.65;color:var(--muted);max-width:62ch}
#toast{position:fixed;right:22px;bottom:22px;z-index:30;max-width:min(430px,calc(100vw - 32px));padding:12px 16px;border-radius:9px;background:var(--text);color:var(--surface);box-shadow:var(--shadow)}#toast:empty{display:none}
@media(max-width:920px){.body{grid-template-columns:190px 1fr;padding:12px}.dialog-body{grid-template-columns:112px 1fr}.field{grid-template-columns:1fr}.panel{padding:14px}.demo-tools{left:12px;right:12px;bottom:10px;overflow:auto}.path{display:none}}
@media(max-width:680px){.tree{display:none}.body{grid-template-columns:1fr}.topbar{padding:0 12px}.workspace-name,.pill{display:none}.dialog-body{grid-template-columns:1fr}.side{display:flex;border-right:0;border-bottom:1px solid var(--border);padding:8px}.side button{width:auto;margin:0}.dialog-foot{flex-wrap:wrap}.dialog-foot .status-text{flex-basis:100%;order:3}}
</style>
</head>
<body>
<div class="app" aria-label="DST Manager multilingual design demo">
  <header class="topbar">
    <span class="brand">DST Manager</span><span class="workspace-name" id="workspaceName"></span><span class="path">C:\Projects\Municipal Renewal\Drawing Set.dst</span><span class="pill" id="readyPill"></span><span class="spacer"></span>
    <button class="icon-button" id="openSettings" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1 2.1-2.4 2.4-2.1-.1-1.5 1.5h-3L9 19.4l-2.1.1-2.4-2.4.1-2.1L3.1 13.5v-3L4.6 9l-.1-2.1 2.4-2.4L9 4.6l1.5-1.5h3L15 4.6l2.1-.1 2.4 2.4-.1 2.1 1.5 1.5v3Z"/></svg><span id="settingsButton"></span></button>
  </header>
  <nav class="tabs" aria-label="Workspace sections"><button class="tab active" id="tabSheets"></button><button class="tab" id="tabProperties"></button><button class="tab" id="tabRevisions"></button></nav>
  <main class="body">
    <aside class="tree"><h2 id="treeTitle"></h2><div class="tree-item" id="treeItem"></div></aside>
    <section class="content"><div class="content-head"><div><h2 id="contentTitle"></h2><p class="hint" id="contentHint"></p></div><span class="spacer"></span><button id="previewButton"></button></div><div class="table-wrap"><div class="table"><div class="tr header"><span id="colNumber"></span><span id="colTitle"></span><span id="colFile"></span></div><div class="tr"><span>C-001</span><span id="rowTitle1"></span><span>01-General-Plan.dwg</span></div><div class="tr"><span>C-002</span><span id="rowTitle2"></span><span>02-Road-Profile.dwg</span></div><div class="tr"><span>C-003</span><span id="rowTitle3"></span><span>03-Drainage-Details.dwg</span></div></div></div></section>
  </main>
</div>

<div class="demo-tools" aria-label="Demo controls"><strong>Demo</strong><label for="systemLocale" id="systemLabel"></label><select id="systemLocale"><option value="zh-CN">中文 Windows</option><option value="en-US">English Windows</option><option value="de-DE">Deutsch Windows</option></select><label for="saveScenario" id="scenarioLabel"></label><select id="saveScenario"><option value="success"></option><option value="validation"></option><option value="conflict"></option></select><button class="quiet" id="toggleTheme"></button></div>

<dialog id="settingsDialog" aria-labelledby="settingsTitle">
  <div class="dialog-shell">
    <header class="dialog-head"><h2 id="settingsTitle"></h2><span class="pill">r8 · Demo</span><span class="spacer"></span><button class="quiet" id="closeSettings" aria-label="Close">✕</button></header>
    <div class="dialog-body">
      <nav class="side" aria-label="Settings sections"><button class="selected" id="sectionGeneral"></button><button id="sectionAbout"></button></nav>
      <section class="panel">
        <div id="errorSummary" class="error-summary" tabindex="-1" hidden></div>
        <div class="group"><h3 class="group-title" id="interfaceGroup"></h3><div class="field" id="localeField"><div class="field-label" id="localeLabel"></div><div class="field-main"><div class="radios" id="localeRadios"></div><p class="hint" id="localeHint"></p><span class="source" id="localeSource"></span><p class="inline-error" id="localeError" hidden></p></div></div></div>
        <div class="group"><h3 class="group-title" id="executionGroup"></h3><div class="field"><div class="field-label" id="parallelLabel"></div><div class="field-main"><select aria-labelledby="parallelLabel"><option>4</option><option>6</option><option>8</option></select><p class="hint" id="parallelHint"></p><span class="source" id="defaultSource"></span></div></div></div>
        <div class="group"><h3 class="group-title" id="diagnosticsGroup"></h3><div class="notice"><strong id="diagnosticTitle"></strong><p class="long-copy" id="diagnosticSummary"></p><details class="detail"><summary id="detailSummary"></summary><code>OSError: [WinError 123] The filename, directory name, or volume label syntax is incorrect.</code></details></div></div>
      </section>
    </div>
    <footer class="dialog-foot"><span class="status-text" id="footStatus"></span><span id="savedBadge" class="saved" hidden></span><span class="spacer"></span><button id="cancelButton"></button><button class="primary" id="saveButton"></button></footer>
  </div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const copy={
  'zh-CN':{workspace:'市政道路改造图纸集',ready:'工作区已就绪',settings:'设置',sheets:'① 图纸',properties:'② 属性',revisions:'③ 修订历史',tree:'图纸集导航',treeItem:'全部图纸（128）',content:'图纸',contentHint:'当前显示 3 条代表性记录；语言切换不改变选择、草稿或任务。',preview:'预览修改',number:'图号',title:'标题',file:'文件',rows:['道路总体平面图','道路纵断面图','排水构造详图'],system:'模拟系统语言',scenario:'保存结果',theme:'切换主题',success:'成功',validation:'校验失败',conflict:'修订冲突',settingsTitle:'设置',general:'常规配置',about:'关于',interface:'界面',language:'界面语言',systemOption:'跟随系统',current:'当前：{language}',zh:'简体中文',en:'English',localeHint:'保存成功后立即切换整个应用；取消或保存失败时继续使用当前语言。',sourceFile:'用户覆盖',sourceDefault:'默认',execution:'任务执行',parallel:'最大并行任务数',parallelHint:'允许范围 1–10。',diagnostics:'错误与诊断示例',diagnosticTitle:'未知错误使用本地化摘要',diagnosticSummary:'未能完成操作。技术详情保持原文并放在可展开区域，不把第三方消息误译为业务结论。',details:'查看原始诊断详情',noChanges:'没有待保存的修改',oneChange:'1 项修改待保存',saved:'已保存',cancel:'取消',save:'保存',saving:'正在保存…',validationTitle:'无法保存设置',validationBody:'界面语言的取值不在允许范围内。请检查后重试。',conflictTitle:'设置已在其他窗口更新',conflictBody:'已保留你的选择并刷新配置修订。请重新保存或取消。',toastSaved:'设置已保存，界面语言已更新。',toastFailed:'保存失败，界面仍保持原语言。',close:'关闭设置'},
  'en-US':{workspace:'Municipal Road Renewal Drawing Set',ready:'Workspace ready',settings:'Settings',sheets:'① Sheets',properties:'② Properties',revisions:'③ Revision history',tree:'Sheet set navigation',treeItem:'All sheets (128)',content:'Sheets',contentHint:'Showing 3 representative records. Changing language does not alter selections, drafts, or running jobs.',preview:'Preview changes',number:'Number',title:'Title',file:'File',rows:['General Road Layout Plan','Road Longitudinal Profile','Drainage Construction Details'],system:'Simulated system language',scenario:'Save result',theme:'Toggle theme',success:'Success',validation:'Validation error',conflict:'Revision conflict',settingsTitle:'Settings',general:'General',about:'About',interface:'Interface',language:'Display language',systemOption:'Follow system',current:'current: {language}',zh:'简体中文',en:'English',localeHint:'The whole application switches after a successful save. Cancelling or a failed save keeps the current language.',sourceFile:'User override',sourceDefault:'Default',execution:'Job execution',parallel:'Maximum parallel jobs',parallelHint:'Allowed range: 1–10.',diagnostics:'Error and diagnostic example',diagnosticTitle:'Unknown errors use a localized summary',diagnosticSummary:'The operation could not be completed. Technical details remain unchanged in an expandable region instead of being mistranslated as a business conclusion.',details:'View original diagnostic details',noChanges:'No unsaved changes',oneChange:'1 change waiting to be saved',saved:'Saved',cancel:'Cancel',save:'Save',saving:'Saving…',validationTitle:'Settings could not be saved',validationBody:'The display language value is outside the allowed set. Check the field and try again.',conflictTitle:'Settings were updated in another window',conflictBody:'Your selection was preserved and the configuration revision was refreshed. Save again or cancel.',toastSaved:'Settings saved. The display language has been updated.',toastFailed:'Save failed. The interface remains in the original language.',close:'Close settings'}
};
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);
let systemLocale=params.get('system')||'zh-CN';let savedLocale=params.get('lang')||'system';let draftLocale=savedLocale;let activeLocale=resolveLocale(savedLocale);let dirty=false;let errorKind='';
function resolveLocale(value){if(value==='zh-CN'||value==='en-US')return value;return systemLocale.startsWith('zh')?'zh-CN':'en-US'}
function t(key){return copy[activeLocale][key]||copy['zh-CN'][key]||key}
function systemName(){return resolveLocale('system')==='zh-CN'?copy[activeLocale].zh:copy[activeLocale].en}
function optionText(value){if(value==='system')return `${t('systemOption')} (${t('current').replace('{language}',systemName())})`;return value==='zh-CN'?t('zh'):t('en')}
function render(){document.documentElement.lang=activeLocale;document.title=`DST Manager · ${t('settingsTitle')} · Demo`;['workspace','ready','settings','sheets','properties','revisions'].forEach((key,i)=>$(i===0?'workspaceName':i===1?'readyPill':i===2?'settingsButton':i===3?'tabSheets':i===4?'tabProperties':'tabRevisions').textContent=t(key));$('treeTitle').textContent=t('tree');$('treeItem').textContent=t('treeItem');$('contentTitle').textContent=t('content');$('contentHint').textContent=t('contentHint');$('previewButton').textContent=t('preview');$('colNumber').textContent=t('number');$('colTitle').textContent=t('title');$('colFile').textContent=t('file');t('rows').forEach((v,i)=>$(`rowTitle${i+1}`).textContent=v);$('systemLabel').textContent=t('system');$('scenarioLabel').textContent=t('scenario');$('toggleTheme').textContent=t('theme');$('saveScenario').options[0].text=t('success');$('saveScenario').options[1].text=t('validation');$('saveScenario').options[2].text=t('conflict');$('settingsTitle').textContent=t('settingsTitle');$('closeSettings').setAttribute('aria-label',t('close'));$('sectionGeneral').textContent=t('general');$('sectionAbout').textContent=t('about');$('interfaceGroup').textContent=t('interface');$('localeLabel').textContent=t('language');$('localeHint').textContent=t('localeHint');$('localeSource').textContent=t('sourceFile');$('executionGroup').textContent=t('execution');$('parallelLabel').textContent=t('parallel');$('parallelHint').textContent=t('parallelHint');$('defaultSource').textContent=t('sourceDefault');$('diagnosticsGroup').textContent=t('diagnostics');$('diagnosticTitle').textContent=t('diagnosticTitle');$('diagnosticSummary').textContent=t('diagnosticSummary');$('detailSummary').textContent=t('details');$('cancelButton').textContent=t('cancel');$('saveButton').textContent=t('save');$('savedBadge').textContent=t('saved');$('footStatus').textContent=dirty?t('oneChange'):t('noChanges');$('localeField').classList.toggle('dirty',dirty);$('localeField').classList.toggle('error',Boolean(errorKind));$('localeRadios').innerHTML=['system','zh-CN','en-US'].map(value=>`<label><input type="radio" name="locale" value="${value}" ${draftLocale===value?'checked':''}>${optionText(value)}</label>`).join('');$('localeRadios').querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{draftLocale=input.value;dirty=draftLocale!==savedLocale;errorKind='';render()}));renderError()}
function renderError(){const box=$('errorSummary'),inline=$('localeError');if(!errorKind){box.hidden=true;inline.hidden=true;box.textContent='';inline.textContent='';return}const title=errorKind==='validation'?t('validationTitle'):t('conflictTitle');const body=errorKind==='validation'?t('validationBody'):t('conflictBody');box.innerHTML=`<strong>${title}</strong><br><a href="#localeField">${body}</a>`;box.hidden=false;inline.textContent=body;inline.hidden=false}
function showToast(message){$('toast').textContent=message;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('toast').textContent='',4200)}
function openDialog(){$('settingsDialog').showModal();$('openSettings').setAttribute('aria-expanded','true');setTimeout(()=>$('localeRadios').querySelector('input:checked')?.focus(),0)}
function closeDialog(){draftLocale=savedLocale;dirty=false;errorKind='';$('settingsDialog').close();$('openSettings').setAttribute('aria-expanded','false');$('openSettings').focus();render()}
$('openSettings').addEventListener('click',openDialog);$('closeSettings').addEventListener('click',closeDialog);$('cancelButton').addEventListener('click',closeDialog);$('settingsDialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
$('saveButton').addEventListener('click',()=>{if(!dirty)return;const scenario=$('saveScenario').value;$('saveButton').disabled=true;$('saveButton').textContent=t('saving');setTimeout(()=>{if(scenario!=='success'){errorKind=scenario;$('saveButton').disabled=false;render();$('errorSummary').focus();showToast(t('toastFailed'));return}savedLocale=draftLocale;activeLocale=resolveLocale(savedLocale);dirty=false;errorKind='';$('saveButton').disabled=false;render();$('savedBadge').hidden=false;$('saveButton').focus();showToast(t('toastSaved'));setTimeout(()=>$('savedBadge').hidden=true,2500)},350)});
$('systemLocale').value=systemLocale;$('systemLocale').addEventListener('change',e=>{systemLocale=e.target.value;if(savedLocale==='system'&&!dirty)activeLocale=resolveLocale('system');render()});$('toggleTheme').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));if(params.get('theme')==='dark')document.documentElement.classList.add('dark');render();openDialog();
</script>
</body>
</html>
