<dialog id="confirm-dialog" aria-labelledby="dialog-title"><div class="dialog-content" id="confirm-content"></div></dialog>
<dialog id="cols-dialog" aria-labelledby="cols-title"><div class="dialog-content"><div class="row"><h2 id="cols-title">显示列</h2><span class="spacer"></span><button data-action="close-cols" class="quiet">关闭</button></div><p class="hint" style="margin:12px 0">固定列不可隐藏。配置仅记忆在此浏览器的 Demo 中。</p><input id="column-search" placeholder="搜索自定义属性" aria-label="搜索自定义属性" style="width:100%"><div id="col-options"></div><button data-action="reset-cols">恢复默认</button></div></dialog>
<script id="demo-model">
// 仅用于交互演示的纯数据模型；命名和验证不是生产后端的替代实现。
const DemoModel=(()=>{
  const names=['图幅','出图比例','备注','专业','设计阶段','设计人','校核人','审核人','出图日期','版本','图纸用途','修订说明'];
  const props=()=>Object.fromEntries(names.map((n,i)=>[n,['A3横向','1:500','待复核','燃气','施工图','张工','李工','王工','2026-09','B','施工','初始版本'][i]]));
  function seed(){let n=0;return {name:'滨河市政工程',groups:['图纸目录','现状燃气管道平面图','一期燃气管道改迁平面图','二期燃气管道改迁平面图','恢复阶段燃气管道平面图'].map((title,i)=>({id:'g'+(i+1),title,sheets:Array.from({length:i?3:1},()=>({id:'s'+(++n),props:props(),pending:false,issue:n===6,unresolved:n===6}))}))};}
  function rows(s){let n=0;return s.groups.flatMap(g=>g.sheets.map((sheet,i)=>{const number=String(++n).padStart(3,'0');const title=g.title+(g.sheets.length>1?`（${i+1}）`:'');return {...sheet,number,title,group:g.id,groupTitle:g.title,file:`RQ-${g.title}.dwg`,layout:`${number} ${title}`};}));}
  function filter(s,f){return rows(s).filter(r=>(f.scope==='all'||r.group===f.scope)&&(!f.q||[r.number,r.title,r.groupTitle,r.file,r.layout,...Object.values(r.props)].join(' ').toLowerCase().includes(f.q.toLowerCase()))&&(f.status==='all'||(f.status==='pending'?r.pending:r.issue))&&(f.path==='all'||(f.path==='unresolved'?r.unresolved:!r.unresolved)));}
  function apply(state,c){const s=structuredClone(state),group=id=>s.groups.find(g=>g.id===id),find=id=>s.groups.flatMap(g=>g.sheets).find(r=>r.id===id);const fail=m=>{throw Error(m)};
    if(c.type==='props'){const r=find(c.id);if(!r)fail('图纸已不存在，请重新选择');for(const [k,v] of Object.entries(c.values)){if(!names.includes(k)||typeof v!=='string')fail('属性字段无效');if(v.length>200)fail(`${k}超过演示上限 200 字`);}r.props={...r.props,...c.values};r.pending=true;}
    else if(c.type==='bulk'){if(!names.includes(c.name)||!c.ids.length)fail('请选择图纸和属性');if(c.mode!=='clear'&&!String(c.value||'').trim())fail('设置值不能为空；清空请显式选择“清空值”');if(c.mode!=='clear'&&String(c.value).length>200)fail('属性值超过演示上限 200 字');for(const id of c.ids){const r=find(id);if(!r)fail('选择中存在已删除图纸');r.props[c.name]=c.mode==='clear'?'':c.value;r.pending=true;}}
    else if(c.type==='delete'){if(!find(c.id))fail('图纸已不存在');for(const g of s.groups)g.sheets=g.sheets.filter(r=>r.id!==c.id);}
    else if(c.type==='delete-group'){if(!group(c.group))fail('子集已不存在');s.groups=s.groups.filter(g=>g.id!==c.group);}
    else if(c.type==='rename'){const g=group(c.group);if(!g)fail('请选择子集');if(!c.title.trim())fail('请输入子集标题');g.title=c.title.trim();g.sheets.forEach(r=>r.pending=true);}
    else if(c.type==='insert'||c.type==='group'){
      const count=Number(c.count);if(!Number.isInteger(count)||count<1||count>20)fail('演示数量须为 1–20 的整数');
      if(c.type==='insert'){const g=group(c.group);if(!g)fail('请选择目标子集');const index=g.sheets.findIndex(r=>r.id===c.ref);if(index<0)fail('请选择目标子集内的参照图纸');if(c.source==='template'&&(!c.template||!c.layout))fail('请选择布局模板文件和布局');const p=c.source==='existing'?g.sheets[0].props:props();g.sheets.splice(index+(c.direction==='after'?1:0),0,...Array.from({length:count},(_,i)=>({id:`${c.token}-${i}`,props:{...p},pending:true,issue:false,unresolved:false})));}
      else {if(!c.title.trim())fail('请输入子集标题');if(!c.base||!c.template||!c.layout)fail('基础模板、布局模板和布局均需选择');const index=s.groups.findIndex(g=>g.id===c.ref);if(s.groups.length&&index<0)fail('请选择参照子集');s.groups.splice(s.groups.length?index+(c.direction==='after'?1:0):0,0,{id:c.token,title:c.title.trim(),sheets:Array.from({length:count},(_,i)=>({id:`${c.token}-${i}`,props:props(),pending:true,issue:false,unresolved:false}))});}
    }else fail('不支持的演示操作');return s;
  }
  return {seed,rows,filter,apply,names};
})();
</script>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>structuredClone(x),initial=DemoModel.seed();let history=[{state:initial,label:'初始模拟数据'}],cursor=0,scope='all',query='',status='all',pathState='all',selection=new Set(),editor=null,form=null,filtersOpen=false,treeOpen=false,activeTab='sheets',overlay='',previewVersion=-1,published=[],focused='',closed=false,formError='';
const defaultCols=()=>({file:true,layout:false,subsetAll:true,subsetSingle:false,props:DemoModel.names.slice(0,3)});let columns=defaultCols();
try{const stored=JSON.parse(localStorage.getItem('dst-demo-009:滨河市政工程:columns'));if(stored&&Array.isArray(stored.props))columns={...columns,...stored,props:stored.props.filter(n=>DemoModel.names.includes(n))};}catch{}
const state=()=>history[cursor].state,allRows=()=>DemoModel.rows(state()),filtered=()=>DemoModel.filter(state(),{scope,q:query,status,path:pathState}),row=id=>allRows().find(r=>r.id===id),group=id=>state().groups.find(g=>g.id===id);
const groupRange=g=>{const a=allRows().filter(r=>r.group===g.id);return a.length?a[0].number+(a.length>1?'–'+a.at(-1).number:''):'空';};
const btn=(label,action,extra='',cls='')=>`<button data-action="${action}" ${extra} class="${cls}">${label}</button>`;
const options=(items,value,blank='')=>(blank?`<option value="">${blank}</option>`:'')+items.map(([v,t])=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(t)}</option>`).join('');
const field=(label,key,value,type='text',wide=false)=>`<label class="field ${wide?'wide':''}"><span>${label}</span><input data-form="${key}" aria-label="${label}" type="${type}" value="${esc(value)}" ${type==='number'?'min="1" max="20" step="1"':''}></label>`;
function toast(message){$('toast').textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',4500);}
function changed(){return editor?Object.keys(editor.values).filter(k=>editor.values[k]!==editor.original[k]).length:form?JSON.stringify(form.values)!==form.original:0;}
function commit(command,label){try{const next=DemoModel.apply(state(),command);history=history.slice(0,cursor+1);history.push({state:next,label});cursor++;previewVersion=-1;selection=new Set([...selection].filter(id=>DemoModel.rows(next).some(r=>r.id===id)));editor=null;form=null;formError='';render();toast('已加入演示草稿；正式文件未修改');return true;}catch(e){formError=e.message;render();$('form-error')?.focus();return false;}}
let modalResolve=null,modalReturn=null;
function ask(title,message,choices,checkbox=''){modalReturn=document.activeElement;const d=$('confirm-dialog');$('confirm-content').innerHTML=`<h2 id="dialog-title">${esc(title)}</h2><p>${esc(message)}</p>${checkbox?`<label class="check-line"><input id="modal-check" type="checkbox">${esc(checkbox)}</label>`:''}<div class="dialog-actions">${choices.map(c=>btn(c.label,'modal-choice',`data-value="${c.value}" ${checkbox&&c.danger?'disabled data-requires-check':''}`,c.danger?'danger':c.primary?'primary':'')).join('')}</div>`;d.showModal();return new Promise(resolve=>modalResolve=resolve);}
function endAsk(value){$('confirm-dialog').close();modalResolve?.(value);modalResolve=null;if(modalReturn?.isConnected)modalReturn.focus();}
$('confirm-dialog').addEventListener('cancel',e=>{e.preventDefault();endAsk('cancel')});
async function guard(next){if(changed()){const answer=await ask('还有未加入草稿的输入','继续前，请先处理当前编辑。取消会留在原处。',[{label:'留在此处',value:'cancel'},{label:'放弃输入',value:'discard'},{label:'加入草稿后继续',value:'save',primary:true}]);if(answer==='cancel')return;if(answer==='save'&&!await saveActive())return;}editor=null;form=null;formError='';next();render();}
function editorErrors(){return editor?Object.keys(editor.values).filter(k=>editor.values[k].length>200):[];}
async function saveActive(){if(editor){const invalid=editorErrors();if(invalid.length){editor.search='';editor.page=Math.floor(DemoModel.names.indexOf(invalid[0])/6);formError='演示校验：以下属性超过 200 字，请修正。';render();$('form-error')?.focus();return false;}if(!changed()){editor=null;render();return true;}return commit({type:'props',id:editor.id,values:editor.values},`修改 ${row(editor.id).number} 属性（${changed()} 项）`);}
  if(!form)return true;const v=form.values;if(form.type==='bulk'){if(v.mode==='clear'){const answer=await ask('清空已选图纸属性',`将清空 ${selection.size} 张图纸的“${v.name}”，包括当前结果之外的选择。只加入草稿。`,[{label:'取消',value:'cancel'},{label:'确认清空并加入草稿',value:'yes',danger:true}]);if(answer!=='yes')return false;}return commit({type:'bulk',...v,ids:[...selection]},`批量${v.mode==='clear'?'清空':'设置'} ${selection.size} 张图纸的${v.name}`);}
  const type=form.type,token='demo-'+Date.now(),c={type,...v,token};const ok=commit(c,type==='rename'?`修改子集标题：${v.title}`:type==='group'?`新建子集：${v.title}（${v.count} 张）`:`新增图纸 ${v.count} 张`);if(ok){scope=type==='group'?token:v.group;focused=type==='insert'||type==='group'?token+'-0':'';render();if(!filtered().some(r=>r.id===focused)&&focused)toast('新增对象被当前筛选隐藏，可清除筛选后定位');}return ok;}

  if(a==='tab'){activeTab=id;render();return;}if(a==='scope'||a==='all-search'){await guard(()=>{scope=a==='all-search'?'all':id;focused='';treeOpen=false;renderLimit=80;});return;}
  if(a==='locate'){await guard(()=>{scope=row(id).group;focused=id;treeOpen=false;overlay='';renderLimit=80;});if(!filtered().some(r=>r.id===id)){const answer=await ask('目标被筛选隐藏','是否清除筛选并定位图纸？不会自动勾选。',[{label:'保留筛选',value:'cancel'},{label:'清除筛选并定位',value:'yes',primary:true}]);if(answer==='yes'){query='';status='all';pathState='all';render();}}$('row-'+id)?.scrollIntoView({block:'nearest'});return;}
  if(a==='select'){if(selection.has(id))selection.delete(id);else selection.add(id);render();return;}if(a==='select-all'){const list=filtered(),remove=list.every(r=>selection.has(r.id));for(const r of list)remove?selection.delete(r.id):selection.add(r.id);render();return;}if(a==='clear-selection'){await guard(()=>selection.clear());return;}if(a==='filters'){filtersOpen=!filtersOpen;render();return;}if(a==='clear-filters'){await guard(()=>{query='';status='all';pathState='all';renderLimit=80;});return;}if(a==='tree'){treeOpen=!treeOpen;render();return;}if(a==='load-more'){renderLimit+=80;render();return;}
  if(a==='edit'){openEditor(id);return;}if(a==='error-field'){editor.search='';editor.page=Math.floor(DemoModel.names.indexOf(b.dataset.name)/6);render();document.querySelector(`[data-prop="${b.dataset.name}"]`)?.focus();return;}if(a==='prop-page'){editor.page+=Number(b.dataset.delta);render();document.querySelector('[data-action="prop-page"]:not(:disabled)')?.focus();return;}if(a==='save'){await saveActive();return;}if(a==='cancel-edit'){await guard(()=>{});return;}if(['rename','new-sheet','new-group','bulk'].includes(a)){openForm({rename:'rename','new-sheet':'insert','new-group':'group',bulk:'bulk'}[a]);return;}
  if(a==='template'){const answer=await ask('选择示例模板','仅使用模拟名称；不读取你的文件，也不启动 AutoCAD。',[{label:'取消',value:'cancel'},{label:b.dataset.key==='base'?'市政基础.dwt':'标准布局.dwg',value:'sample',primary:true}]);if(answer==='sample'){form.values[b.dataset.key]=b.dataset.key==='base'?'市政基础.dwt':'标准布局.dwg';if(b.dataset.key==='template')form.values.layout='标准图框';render();}return;}
  if(a==='delete'||a==='delete-group'){await guard(async()=>{});if(editor||form)return;const target=a==='delete'?row(id):group(id);if(!target)return;const answer=await ask(a==='delete'?'加入图纸删除草稿':'加入整个子集删除草稿',a==='delete'?`将移除图纸 ${target.number}，可在草稿栈撤销；正式文件影响需由服务端预览确认。`:`将移除子集“${target.title}”及 ${target.sheets.length} 张图纸。正式产品不证明工程外部引用，发布前须理解外部影响。`,[{label:'取消',value:'cancel'},{label:'加入删除草稿',value:'yes',danger:true}],a==='delete-group'?'我已理解整子集删除与外部引用风险':'');if(answer==='yes')commit(a==='delete'?{type:'delete',id}:{type:'delete-group',group:id},a==='delete'?`删除图纸 ${target.number}`:`删除子集 ${target.title}`);return;}
  if(a==='undo'||a==='redo'){await guard(()=>{cursor+=a==='undo'?-1:1;previewVersion=-1;selection=new Set([...selection].filter(id=>allRows().some(r=>r.id===id)));if(scope!=='all'&&!group(scope))scope='all';});return;}
  if(a==='overlay'){overlay=id;render();return;}if(a==='close-overlay'){overlay='';render();return;}if(a==='preview'){await guard(()=>{previewVersion=cursor;overlay='preview';});return;}
  if(a==='publish'){await guard(async()=>{});if(editor||form||previewVersion!==cursor)return;const answer=await ask('模拟确认写入','此操作只把演示草稿设为新模拟基准。不会写入 DST / DWG、不会启动 CAD，也不代表通过真实发布校验。',[{label:'取消',value:'cancel'},{label:'模拟确认写入',value:'yes',danger:true}],'我知道这是模拟操作');if(answer==='yes'){const s=clone(state());s.groups.forEach(g=>g.sheets.forEach(r=>r.pending=false));published.push(`${cursor} 条变更 · ${allRows().length} 张图纸`);history=[{state:s,label:'模拟发布基准'}];cursor=0;previewVersion=-1;overlay='progress';render();toast('模拟发布完成 · 未修改任何工程文件');}return;}
  if(a==='reset'){const answer=await ask('重置演示','恢复初始 13 张图纸并清空本次演示草稿及输入。显示列偏好保留。',[{label:'取消',value:'cancel'},{label:'重置演示',value:'yes',danger:true}]);if(answer==='yes'){history=[{state:DemoModel.seed(),label:'初始模拟数据'}];cursor=0;scope='all';query='';status='all';pathState='all';selection.clear();editor=null;form=null;formError='';previewVersion=-1;published=[];overlay='';closed=false;activeTab='sheets';render();}return;}
  if(a==='close'){await guard(()=>{closed=true;overlay='';});return;}if(a==='reopen'){closed=false;activeTab='sheets';render();return;}
});
window.addEventListener('beforeunload',e=>{if(changed()||cursor){e.preventDefault();e.returnValue='';}});
render();
</script>
