[alembic]
script_location = builder_migrations
prepend_sys_path = .
path_separator = os
# Default target is an in-memory database to avoid accidental files in the repo.
# Real targets are injected programmatically or via DST_BUILDER_DATABASE_URL, e.g.
#   DST_BUILDER_DATABASE_URL=sqlite:///<temp-dir>/project.dstb uv run alembic -c builder_alembic.ini upgrade head
# (Keep this file ASCII-only: alembic reads it with the locale codec on Windows.)
sqlalchemy.url = sqlite:///:memory:

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
